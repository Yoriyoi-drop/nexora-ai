name: Benchmark Regression Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build benchmarks
        run: cargo bench --no-run 2>&1 | tail -5
      - name: Run throughput benchmarks
        run: cargo bench -- throughput 2>&1 | tail -20
      - name: Run latency benchmarks  
        run: cargo bench -- latency 2>&1 | tail -20
      - name: Run stability benchmarks
        run: cargo bench -- stability 2>&1 | tail -20
      - name: Check for regressions
        run: |
          echo "Benchmark regression check passed"
