# ==================================================
# Inference Configuration (Production)
# ==================================================

[engine]
# H200: 141GB HBM3e → large batch & KV cache
max_batch_size = 256
max_sequence_length = 131072
enable_kv_cache = true
kv_cache_size_mb = 102400

[decoding]
default_temperature = 0.7
default_top_p = 0.9
default_top_k = 40
max_tokens = 4096

[streaming]
enable_streaming = true
streaming_buffer_size = 32
streaming_timeout_seconds = 300

[latency]
target_latency_ms = 500
max_latency_ms = 10000
p95_target_ms = 1500