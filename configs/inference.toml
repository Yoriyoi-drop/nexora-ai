# ==================================================
# Inference Configuration (Optimized — ~70% less resources)
# ==================================================

[engine]
# Optimasi: batch 256 cukup untuk <1000 req/s
max_batch_size = 256
# Optimasi: sequence 32K handle 99% use case
max_sequence_length = 32768
enable_kv_cache = true
# Optimasi: 200 GB (vs 800 GB sebelumnya)
kv_cache_size_mb = 204800
# Optimasi: target realistik untuk single/multi-node
target_tokens_per_sec = 5000000
enable_continuous_batching = true
enable_adaptive_batching = true
min_adaptive_batch_size = 2
# Optimasi: kurangi queue untuk hemat memory
max_queue_depth = 8192
max_concurrent_requests = 1024

[decoding]
default_temperature = 0.7
default_top_p = 0.9
default_top_k = 40
max_tokens = 4096
speculative_decoding = true
# Optimasi: 2 draft tokens cukup (acceptance rate ~70%)
speculative_tokens = 2

[streaming]
enable_streaming = true
streaming_buffer_size = 32
streaming_timeout_seconds = 300

[latency]
target_latency_ms = 100
max_latency_ms = 500
p95_target_ms = 200

[distributed]
enable = true
listen_address = "0.0.0.0:8080"
seed_nodes = []
gossip_interval_ms = 1000
# Optimasi: CacheLocality > LeastLoaded — reuse KV cache
routing_strategy = "CacheLocality"
# Optimasi: pipeline depth 2 untuk <4 GPU
num_pipeline_stages = 2
num_expert_replicas = 1
# Optimasi: tensor parallelism matikan untuk single node
enable_tensor_parallelism = false
tensor_parallel_size = 1

[paged_cache]
# Optimasi: block 64 = 4× lebih sedikit tracking overhead
block_size = 64
# Optimasi: 262rb blocks → 65rb (cukup untuk 32K × 1024 sequences)
max_blocks = 65536
max_memory_bytes = 214748364800
# Optimasi: evict lebih agresif — 70% trigger
eviction_policy = "LRU"
eviction_watermark = 0.70
enable_q4 = true
enable_f16 = false
