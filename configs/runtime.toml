# ==================================================
# Runtime Configuration (20M tok/s Distributed)
# ==================================================

[scheduler]
max_concurrent_tasks = 1000000
task_timeout_seconds = 300
queue_size = 500000
scheduling_policy = "PriorityAging"
aging_boost_per_ms = 0.005

[executor]
# Multi-node: 64 cores × 8 nodes = 512 threads
thread_pool_size = 512
max_blocking_threads = 1024
keep_alive_seconds = 120

[resource]
# Aggregated: 8× H200 = 1.1TB GPU memory
max_memory_mb = 2097152
max_gpu_memory_mb = 1120000
enable_gpu = true
gpu_device_ids = [0, 1, 2, 3, 4, 5, 6, 7]
enable_unified_memory = true

[monitoring]
enable_metrics = true
metrics_port = 9090
health_check_interval_seconds = 10
enable_distributed_tracing = true
trace_endpoint = "http://jaeger:4317"

[core]
max_tiers_in_vram = 3
vram_budget_mb = 0
eviction_threshold = 0.90

[distributed]
node_id = "node-0"
cluster_size = 8
pipeline_parallelism = true
pipeline_depth = 8
expert_parallelism = true
num_expert_shards = 4
tensor_parallelism = true
tensor_parallel_size = 2
enable_gossip = true
gossip_interval_ms = 500
heartbeat_timeout_ms = 3000
node_eviction_timeout_ms = 15000
