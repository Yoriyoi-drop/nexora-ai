# ==================================================
# Runtime Configuration (Production)
# ==================================================

[scheduler]
max_concurrent_tasks = 1000
task_timeout_seconds = 300
queue_size = 50000

[executor]
thread_pool_size = 32
max_blocking_threads = 128
keep_alive_seconds = 120

[resource]
max_memory_mb = 65536
max_gpu_memory_mb = 0
enable_gpu = true
gpu_device_ids = []

[monitoring]
enable_metrics = true
metrics_port = 9090
health_check_interval_seconds = 10

[core]
max_tiers_in_vram = 3
vram_budget_mb = 0
eviction_threshold = 0.90