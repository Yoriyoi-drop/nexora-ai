# ==================================================
# Runtime Configuration (Production)
# ==================================================

[scheduler]
max_concurrent_tasks = 10000
task_timeout_seconds = 300
queue_size = 50000

[executor]
# H200 node: many CPU cores for data loading & orchestration
thread_pool_size = 64
max_blocking_threads = 256
keep_alive_seconds = 120

[resource]
# H200: 141GB HBM3e GPU + high system RAM
max_memory_mb = 262144
max_gpu_memory_mb = 140000
enable_gpu = true
gpu_device_ids = [0]

[monitoring]
enable_metrics = true
metrics_port = 9090
health_check_interval_seconds = 10

[core]
max_tiers_in_vram = 3
vram_budget_mb = 0
eviction_threshold = 0.90