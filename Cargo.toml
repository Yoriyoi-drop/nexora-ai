[workspace]
resolver = "2"
exclude = ["crates/Telemetry"]
members = [
    "crates/agent",
    "crates/atqs",
    "crates/blaa",
    "crates/core",
    "crates/cognition",
    "crates/database",
    "crates/deeplearning",
    "crates/erp",
    "crates/foundation",
    "crates/inference",
    "crates/intelligence",
    "crates/memory",
    "crates/models",
    "crates/monitoring",
    "crates/runtime",
    "crates/infrastructure",
    "crates/infrastructure/common",
    "crates/infrastructure/utils",
    "crates/datastream",
    "crates/has-moe-ffn",
    "crates/hldva-t",
    "crates/shared",
    "crates/validation",

    "crates/oracle",
    "crates/training",
    "crates/alignment",
    "crates/evaluation",
    "crates/transformer",
    "crates/vogp",
    "crates/model-omnis",
    "crates/model-vortex",
    "crates/model-aether",
    "crates/model-axiom",
    "crates/model-cipher",
    "crates/model-genesis",
    "crates/model-kronos",
    "crates/model-nexum",
    "crates/model-spectra",
    "crates/model-swift",
    "crates/eventbus",
    "crates/cost-optimizer",
    "apps/nexora-ai",
    "apps/dashboard",
    "crates/benchmark",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Nexora AI Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexora-ai/nexora"

[workspace.metadata]
docs-rs = { all-features = true }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1
debug = 1

[profile.bench]
lto = "fat"
codegen-units = 1


[workspace.dependencies]
# Async runtime
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "time"] }
# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
thiserror = "2.0"
# Concurrency
rayon = "1.8"
crossbeam = "0.8"
# Math/tensor operations
ndarray = { version = "0.16", features = ["serde"] }
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Testing
mockall = "0.12"
proptest = "1.4"
tempfile = "3.8"
# Performance
parking_lot = "0.12"
once_cell = "1.19"
lru = "0.12"
# Text processing
regex = "1.10"
unicode-segmentation = "1.11"
smallvec = { version = "1.0", features = ["serde"] }
# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
# Async traits
async-trait = "0.1"
# Async utilities
futures = "0.3"
# Random
rand = "0.8"
itertools = "0.12"
# Time handling
chrono = { version = "0.4", features = ["serde"] }
# HTTP server
axum = "0.7"
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "compression-br", "trace"] }
# Database drivers
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "chrono", "uuid"] }
postgres = "0.19"
mysql = "25"
# HTTP client (untuk API requests)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }

# Dataset format parsers
csv = "1.3"
parquet = { version = "53", default-features = false, features = ["arrow", "snap"] }

# High-performance concurrent map
dashmap = "6"

# Priority queue
priority-queue = "2"

# Dataset streaming
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"
memmap2 = "0.9"
sha2 = "0.11"
hex = "0.4"
half = "2.4"

rustls-pemfile = "2.0"
argon2 = "0.5"

# Terminal UI dependencies
ratatui = "0.26"
crossterm = "0.27"
tui-input = "0.8"
arboard = "3.3"  # For clipboard access
sysinfo = "0.30"  # For system monitoring
# psutil removed — use sysinfo (already included) for process stats
# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
