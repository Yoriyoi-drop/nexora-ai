# Nexora AI — Cargo build configuration
#
# For debug builds:
#   cargo build
#
# For production builds:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=lld"
]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
overflow-checks = false
incremental = false
debug = 1

[profile.dev]
opt-level = 0
debug = true
panic = "unwind"
overflow-checks = true
incremental = true