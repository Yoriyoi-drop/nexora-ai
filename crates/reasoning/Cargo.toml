[package]
name = "nexora-reasoning"
version = "0.2.0"
edition = "2021"
description = "SACA - Symbolic Algorithmic Coding Architecture reasoning framework"

[dependencies]
nexora-shared = { path = "../shared" }
nexora-atqs = { path = "../atqs" }
nexora-multimodal = { path = "../multimodal" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
nexora-oracle = { path = "../oracle" }
nexora-core = { path = "../core" }
nexora-common = { path = "../infrastructure/common" }
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "time", "process", "io-util", "fs"] }
uuid.workspace = true
chrono.workspace = true
rand.workspace = true
rayon.workspace = true
thiserror.workspace = true
futures.workspace = true
ndarray.workspace = true
serde_json.workspace = true
async-trait = "0.1"

[features]
default = []
gpu = ["nexora-oracle/gpu"]
