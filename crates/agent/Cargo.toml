[package]
name = "nexora-agent"
version = "0.2.0"
edition = "2021"
description = "Agent layer for behavior and coordination in Nexora AI"

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true
futures = { workspace = true }
parking_lot.workspace = true
crossbeam.workspace = true
chrono.workspace = true
rand = { workspace = true }
regex = { workspace = true }
reqwest.workspace = true
dashmap.workspace = true

# Internal dependencies
nexora-core = { path = "../core" }
nexora-intelligence = { path = "../intelligence" }
nexora-memory = { path = "../memory" }
nexora-common = { path = "../infrastructure/common" }
nexora-deeplearning = { path = "../deeplearning", optional = true }

# Cross-layer dependencies (Phase 5 wiring)
nexora-alignment = { path = "../alignment" }
nexora-database = { path = "../database" }
nexora-cognition = { path = "../cognition" }
nexora-monitoring = { path = "../monitoring" }
nexora-utils = { path = "../infrastructure/utils" }
nexora-validation = { path = "../validation" }

[features]
default = ["gpu"]
gpu = ["nexora-deeplearning/gpu"]

[dev-dependencies]
mockall.workspace = true
tokio-test = "0.4"
