[package]
name = "nexora-deeplearning"
version = "0.1.0"
edition = "2021"
authors = ["Nexora AI Team"]
description = "Deep Learning Library for Nexora AI — hub crate re-exporting sub-crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexora-ai/nexora-ai"
homepage = "https://nexora.ai"
documentation = "https://docs.nexora.ai/deeplearning"
readme = "README.md"

[dependencies]
nexora-autograd = { path = "../autograd" }
nexora-star-x = { path = "../star-x" }
nexora-gnac = { path = "../gnac" }
nexora-echo-net = { path = "../echo-net" }

# GPU compute backend (wgpu — cross-platform)
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
ndarray = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["std"]
std = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
full = ["std", "gpu"]

[lib]
name = "nexora_deeplearning"
path = "src/lib.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
