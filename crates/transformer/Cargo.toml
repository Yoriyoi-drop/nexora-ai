[package]
name = "nexora-transformer"
version = "0.2.0"
edition = "2021"
description = "Transformer model implementation for Nexora - CausalLM, GQA, RoPE, SwiGLU, MTP"

[dependencies]
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rayon.workspace = true
nexora-deeplearning = { path = "../deeplearning" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
wgpu = { version = "29", optional = true }
half = { workspace = true, optional = true }
lru.workspace = true
reqwest = { workspace = true, optional = true }
nexora-atqs = { path = "../atqs" }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "forward_pass"
harness = false

[features]
default = ["gpu"]
gpu = ["nexora-deeplearning/gpu", "dep:wgpu", "dep:half"]
nccl = ["nexora-deeplearning/cuda", "dep:reqwest"]
http = ["dep:reqwest"]
