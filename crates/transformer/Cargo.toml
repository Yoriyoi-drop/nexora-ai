[package]
name = "nexora-transformer"
version = "0.1.0"
edition = "2021"
description = "Transformer model implementation for Nexora - CausalLM, GQA, RoPE, SwiGLU, MTP"

[dependencies]
ndarray.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
rayon.workspace = true
nexora-autograd = { path = "../autograd" }
wgpu = { version = "29", optional = true }

[features]
default = ["gpu"]
gpu = ["nexora-autograd/gpu", "dep:wgpu"]
