[package]
name = "nexora-quantization"
version = "0.2.0"
edition = "2021"
description = "Weight quantization helpers — INT8 and INT4 (packed/groupwise)"

[dependencies]
ndarray.workspace = true
serde.workspace = true
tracing.workspace = true

nexora-autograd = { path = "../autograd", default-features = false, features = ["std"] }

[features]
default = []
gpu = ["nexora-autograd/gpu"]
