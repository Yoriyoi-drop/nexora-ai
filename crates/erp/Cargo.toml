[package]
name = "nexora-erp"
version = "0.2.0"
edition = "2021"
description = "Entropic Resonance Pruning (ERP) - Strengthened Architecture"

[features]
default = []
gpu = ["nexora-autograd/gpu"]
cuda = ["nexora-autograd/cuda"]

[dependencies]
ndarray.workspace = true
ndarray-rand = "0.15"
rand.workspace = true
rand_distr = "0.6"
thiserror.workspace = true
tracing.workspace = true
lru = { workspace = true }
uuid.workspace = true
nexora-autograd = { path = "../autograd", default-features = false, features = ["std"] }
