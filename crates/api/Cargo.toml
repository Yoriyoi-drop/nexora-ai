[package]
name = "nexora-api"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "signal", "macros"] }
tracing = { workspace = true }
axum = { workspace = true }
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "trace"] }
hyper = "1.0"
rustc_version_runtime = "0.2"
uuid = { workspace = true, features = ["v4"] }
regex = { workspace = true }
rand = { workspace = true }
async-trait = { workspace = true }
# Compression support
flate2 = { workspace = true }
# System monitoring
sysinfo = { workspace = true }
# Infrastructure
nexora-infrastructure = { path = "../infrastructure" }
nexora-common = { path = "../infrastructure/common" }

# Cross-layer dependencies (Phase 5 wiring)
nexora-validation = { path = "../validation" }
nexora-database = { path = "../database" }
nexora-isolation = { path = "../isolation" }
nexora-monitoring = { path = "../monitoring" }
rustls-pemfile = { workspace = true, optional = true }

[features]
default = []
tls = ["tokio-rustls", "axum-server", "rustls-pemfile", "rcgen", "time"]
rustls = ["tokio-rustls"]

[dependencies.tokio-rustls]
version = "0.24"
optional = true

[dependencies.axum-server]
version = "0.6"
optional = true
features = ["tls-rustls"]

[dependencies.rcgen]
version = "0.12"
optional = true

[dependencies.time]
version = "0.3"
optional = true

[dev-dependencies]
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "signal", "macros"] }
futures = { workspace = true }
