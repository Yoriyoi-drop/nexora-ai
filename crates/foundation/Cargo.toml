[package]
name = "nexora-foundation"
version = "0.2.0"
edition = "2021"
description = "Foundation AI frameworks and shared utilities for Nexora AI"

[dependencies]
# Core dependencies
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
ndarray.workspace = true
ndarray-rand = "0.15"
rand_distr = "0.6"
tracing.workspace = true
uuid.workspace = true

# Internal dependencies

nexora-atqs = { path = "../atqs" }
nexora-erp = { path = "../erp" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
nexora-hldva-t = { path = "../hldva-t" }
nexora-vogp = { path = "../vogp" }
nexora-transformer = { path = "../transformer" }
nexora-shared = { path = "../shared" }
nexora-validation = { path = "../validation" }
nexora-alignment = { path = "../alignment" }
nexora-oracle = { path = "../oracle" }
nexora-training = { path = "../training" }
nexora-multimodal = { path = "../multimodal" }
nexora-reasoning = { path = "../reasoning" }
nexora-models = { path = "../models" }
nexora-quantization = { path = "../quantization" }
nexora-core = { path = "../core" }
nexora-common = { path = "../infrastructure/common" }
nexora-deeplearning = { path = "../deeplearning" }
nexora-tokenizer = { path = "../tokenizer" }
nexora-hallucination = { path = "../hallucination" }
nexora-echo-net = { path = "../echo-net", features = ["examples"] }
nexora-monitoring = { path = "../monitoring" }
nexora-memory = { path = "../memory" }
nexora-utils = { path = "../infrastructure/utils" }
nexora-database = { path = "../database", features = ["postgres", "sqlite"] }
nexora-isolation = { path = "../isolation" }

# Framework-specific dependencies
async-trait.workspace = true
rustc-hash = "2.0"
rand.workspace = true
regex.workspace = true
once_cell = { workspace = true }
chrono.workspace = true
futures.workspace = true

# Compression (ATQS) dependencies
flate2 = { workspace = true }
fastrand = "2.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }

# Multimodal (CAFFEINE) dependencies
unicode-segmentation.workspace = true

# Reasoning (SACA) dependencies
crossbeam.workspace = true
parking_lot.workspace = true

# Alignment (SPARO) dependencies
md5 = "0.7"
bincode = "1.3"

# Cache dependencies

[features]
default = ["gpu"]
gpu = ["nexora-deeplearning/gpu", "nexora-transformer/gpu"]

[dev-dependencies]
mockall.workspace = true
proptest.workspace = true
criterion = { workspace = true, features = ["html_reports"] }

