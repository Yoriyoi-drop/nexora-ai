[package]
name = "nexora-database"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { package = "yaml_serde", version = "0.10" }
toml = "0.8"
tokio = { workspace = true, features = ["sync", "macros", "rt", "net"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
async-trait = { workspace = true }
secrecy = "0.8"
# Date/time parsing
chrono = { workspace = true, features = ["serde"] }

# Database drivers (optional)
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.12", optional = true }
rustls = { version = "0.23", optional = true, features = ["ring"] }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
sqlx = { workspace = true, optional = true, default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
mysql = { workspace = true, optional = true }
futures = { workspace = true }
nexora-common = { path = "../infrastructure/common" }

[features]
default = []
tls = ["tokio-postgres-rustls", "rustls"]
postgres = ["tokio-postgres", "tokio-postgres-rustls", "rustls"]
sqlite = ["rusqlite"]
sqlx = ["dep:sqlx"]
mysql = ["dep:mysql"]
all = ["postgres", "sqlite", "sqlx", "mysql"]
