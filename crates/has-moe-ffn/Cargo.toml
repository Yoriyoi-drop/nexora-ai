[package]
name = "nexora-has-moe-ffn"
version = "0.2.0"
edition = "2021"
description = "Heterogeneous Attention-based Sparse MoE Feed-Forward Network"

[dependencies]
serde.workspace = true
thiserror.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
nexora-autograd = { path = "../autograd", default-features = false, features = ["std"], optional = true }
nexora-quantization = { path = "../quantization" }

[dependencies.cudarc]
version = "0.19"
optional = true

[features]
default = ["gpu"]
gpu = ["nexora-autograd/gpu"]
cuda = ["nexora-autograd/cuda", "cudarc"]
