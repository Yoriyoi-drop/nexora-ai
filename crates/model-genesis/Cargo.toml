[package]
name = "nexora-model-genesis"
version = "0.1.0"
edition = "2021"
description = "NXR-GENESIS Model"

[dependencies]
nexora-shared = { path = "../shared" }
nexora-model-core = { path = "../model-core" }
nexora-transformer = { path = "../transformer" }
nexora-cognition = { path = "../cognition" }
nexora-alignment = { path = "../alignment" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true

[features]
default = []
gpu = ["nexora-shared/gpu", "nexora-cognition/gpu"]
cuda = ["nexora-shared/cuda"
]
