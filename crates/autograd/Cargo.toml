[package]
name = "nexora-autograd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Unified autograd crate — CPU tensor ops, GPU acceleration (wgpu/CUDA), and training pipelines"

[dependencies]
ndarray.workspace = true
parking_lot.workspace = true
rand.workspace = true
tracing.workspace = true
thiserror.workspace = true
once_cell.workspace = true
serde = { workspace = true, optional = true }
half = "2"
chrono.workspace = true
serde_json.workspace = true
num_cpus = "1.16"

# GPU (optional, gated by "gpu" feature)
wgpu = { version = "29", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
cudarc = { version = "0.19", features = ["dynamic-loading", "cuda-version-from-build-system", "nccl"], optional = true }

[features]
default = ["std", "serde"]
std = []
serde = ["dep:serde"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:libc", "device-gpu"]
cuda = ["gpu", "dep:cudarc", "device-cuda"]
device-gpu = []
device-cuda = []
