[package]
name = "nexora-autograd"
version = "0.2.0"
edition = "2021"
description = "Unified re-export crate for autograd ecosystem"

[dependencies]
nexora-autograd-core = { path = "../autograd-core" }
nexora-autograd-gpu = { path = "../autograd-gpu", optional = true }

ndarray.workspace = true
parking_lot.workspace = true
rand.workspace = true
tracing.workspace = true

[features]
default = ["std", "serde", "gpu"]
std = ["nexora-autograd-core/std"]
serde = ["nexora-autograd-core/serde"]
gpu = ["nexora-autograd-gpu", "nexora-autograd-core/device-gpu"]
cuda = ["nexora-autograd-gpu/cuda", "nexora-autograd-core/device-cuda"]
