[package]
name = "nexora-intelligence"
version = "0.2.0"
edition = "2021"
description = "Intelligence orchestration and model access layer for Nexora AI"

[dependencies]
nexora-core = { path = "../core" }
nexora-tokenizer = { path = "../tokenizer" }
nexora-common = { path = "../infrastructure/common" }
nexora-foundation = { path = "../foundation" }
tokio = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "net", "signal"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rayon.workspace = true
ndarray = { workspace = true, features = ["serde"] }
tracing.workspace = true
log = "0.4"
parking_lot.workspace = true
rand.workspace = true
async-trait = { workspace = true }
rand_distr = "0.6"
ndarray-rand = "0.15"
uuid.workspace = true
regex = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
# QLoRA specific dependencies
half.workspace = true  # For BF16/FP16 support
tracing-subscriber.workspace = true
num_cpus = "1.16"  # For CPU core detection

md5 = "0.7"  # For model fingerprinting
tempfile = { workspace = true }  # For testing
futures = { workspace = true }  # For async utilities

# System monitoring dependencies
sysinfo = { workspace = true }  # For system information
# psutil removed — use sysinfo for system stats

# HTTP server
axum.workspace = true
tower.workspace = true

# TOML parsing
toml = "0.8"

# Additional dependencies
fastrand = "2.0"
serde_yaml = { package = "yaml_serde", version = "0.10" }

# GPU acceleration
nexora-autograd = { path = "../autograd", optional = true }

# Cross-layer dependencies (Phase 5 wiring)
nexora-cognition = { path = "../cognition" }
nexora-memory = { path = "../memory" }
nexora-database = { path = "../database" }
nexora-monitoring = { path = "../monitoring" }
nexora-utils = { path = "../infrastructure/utils" }
nexora-validation = { path = "../validation" }
nexora-isolation = { path = "../isolation" }
nexora-quantization = { path = "../quantization" }

# SPARO specific dependencies
# Note: These are older packages - implement custom logic instead

[features]
default = ["gpu"]
gpu = ["nexora-autograd/gpu"]

[lib]
name = "nexora_model"
path = "src/lib.rs"

[dev-dependencies]
once_cell = { workspace = true }
criterion = { workspace = true, features = ["html_reports"] }
proptest.workspace = true

[[bench]]
name = "end_to_end_integration"
harness = false

