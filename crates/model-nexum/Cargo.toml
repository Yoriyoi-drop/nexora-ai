[package]
name = "nexora-model-nexum"
version = "0.1.0"
edition = "2021"
description = "NXR-NEXUM Model"

[dependencies]
nexora-model-core = { path = "../model-core" }
nexora-shared = { path = "../shared" }
nexora-transformer = { path = "../transformer" }
nexora-oracle = { path = "../oracle" }
nexora-alignment = { path = "../alignment" }
nexora-cognition = { path = "../cognition" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true

[features]
default = []
gpu = ["nexora-model-core/gpu", "nexora-shared/gpu", "nexora-cognition/gpu", "nexora-oracle/gpu"]
cuda = ["nexora-model-core/cuda", "nexora-shared/cuda"]

