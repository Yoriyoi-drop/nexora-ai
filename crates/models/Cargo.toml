[package]
name = "nexora-models"
version = "0.2.0"
edition = "2021"
description = "NXR Model Series — re-export crate for all 10 model types"

[dependencies]
nexora-model-core = { path = "../model-core" }
nexora-model-omnis = { path = "../model-omnis" }
nexora-model-vortex = { path = "../model-vortex" }
nexora-model-aether = { path = "../model-aether" }
nexora-model-axiom = { path = "../model-axiom" }
nexora-model-cipher = { path = "../model-cipher" }
nexora-model-genesis = { path = "../model-genesis" }
nexora-model-kronos = { path = "../model-kronos" }
nexora-model-nexum = { path = "../model-nexum" }
nexora-model-spectra = { path = "../model-spectra" }
nexora-model-swift = { path = "../model-swift" }
nexora-shared = { path = "../shared" }
nexora-transformer = { path = "../transformer" }
nexora-core = { path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true

