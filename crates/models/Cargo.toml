[package]
name = "nexora-models"
version = "0.2.0"
edition = "2021"
description = "NXR Model Series implementations - 10 model types with agent-based architectures"

[dependencies]
nexora-core = { path = "../core" }
nexora-shared = { path = "../shared" }
nexora-erp = { path = "../erp" }
nexora-vogp = { path = "../vogp" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
nexora-multimodal = { path = "../multimodal" }
nexora-oracle = { path = "../oracle" }
nexora-reasoning = { path = "../reasoning" }
nexora-transformer = { path = "../transformer" }
nexora-alignment = { path = "../alignment" }
nexora-hallucination = { path = "../hallucination", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
ndarray = { workspace = true }
rand.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

[features]
default = ["hallucination"]
hallucination = ["nexora-hallucination"]

# Simulated model architectures — keyword-matching/template-based agent models.
# These are NOT real neural networks. They exist for legacy agent orchestration flows.
# Default OFF. All real inference uses CausalLM-backed foundation models instead.
simulated-models = []
