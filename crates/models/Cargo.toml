[package]
name = "nexora-models"
version = "0.2.0"
edition = "2021"
description = "NXR Model Series implementations - 10 model types with agent-based architectures"

[dependencies]
nexora-core = { path = "../core" }
nexora-shared = { path = "../shared" }
nexora-erp = { path = "../erp" }
nexora-vogp = { path = "../vogp" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
nexora-multimodal = { path = "../multimodal" }
nexora-oracle = { path = "../oracle" }
nexora-reasoning = { path = "../reasoning" }
nexora-transformer = { path = "../transformer" }
nexora-alignment = { path = "../alignment" }
nexora-hallucination = { path = "../hallucination" }
nexora-database = { path = "../database" }
nexora-monitoring = { path = "../monitoring" }
nexora-utils = { path = "../infrastructure/utils" }
nexora-validation = { path = "../validation" }
nexora-quantization = { path = "../quantization" }
nexora-isolation = { path = "../isolation" }
nexora-memory = { path = "../memory" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
ndarray = { workspace = true }
rand.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"

[features]
default = []

# Hallucination detection and mitigation pipelines for production inference
# Activated via nexora-hallucination dependency (not empty feature gate)
hallucination = []
