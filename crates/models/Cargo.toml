[package]
name = "nexora-models"
version = "0.2.0"
edition = "2021"
description = "NXR Model Series — re-export crate for all 10 model types"

[dependencies]
nexora-model-core = { path = "../model-core" }
nexora-model-omnis = { path = "../model-omnis" }
nexora-model-vortex = { path = "../model-vortex" }
nexora-model-aether = { path = "../model-aether" }
nexora-model-axiom = { path = "../model-axiom" }
nexora-model-cipher = { path = "../model-cipher" }
nexora-model-genesis = { path = "../model-genesis" }
nexora-model-kronos = { path = "../model-kronos" }
nexora-model-nexum = { path = "../model-nexum" }
nexora-model-spectra = { path = "../model-spectra" }
nexora-model-swift = { path = "../model-swift" }
nexora-shared = { path = "../shared" }
nexora-transformer = { path = "../transformer" }
nexora-core = { path = "../core" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true

[features]
default = []
gpu = [
    "nexora-model-core/gpu",
    "nexora-shared/gpu",
    "nexora-model-omnis/gpu",
    "nexora-model-vortex/gpu",
    "nexora-model-aether/gpu",
    "nexora-model-axiom/gpu",
    "nexora-model-cipher/gpu",
    "nexora-model-genesis/gpu",
    "nexora-model-kronos/gpu",
    "nexora-model-nexum/gpu",
    "nexora-model-spectra/gpu",
    "nexora-model-swift/gpu",
]
cuda = [
    "nexora-model-core/cuda",
    "nexora-shared/cuda",
    "nexora-model-omnis/cuda",
    "nexora-model-vortex/cuda",
    "nexora-model-aether/cuda",
    "nexora-model-axiom/cuda",
    "nexora-model-cipher/cuda",
    "nexora-model-genesis/cuda",
    "nexora-model-kronos/cuda",
    "nexora-model-nexum/cuda",
    "nexora-model-spectra/cuda",
    "nexora-model-swift/cuda",
]

