[package]
name = "nexora-echo-net"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
rand = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
nexora-autograd = { path = "../autograd" }
num-traits = "0.2"
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl"] }
bytemuck = { version = "1", optional = true }

[features]
default = ["std"]
std = []
gpu = ["nexora-autograd/gpu", "dep:wgpu", "dep:bytemuck"]
