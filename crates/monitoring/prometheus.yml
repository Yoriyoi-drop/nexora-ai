# ==================== Nexora-AI Prometheus Configuration ====================
# Global configuration
global:
  scrape_interval: 15s  # Default scrape interval
  evaluation_interval: 15s  # Evaluate rules every 15 seconds
  external_labels:
    cluster: 'nexora-production'
    environment: 'production'

# Alertmanager configuration (optional, for alerting)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Rule files
# rule_files:
#   - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # ==================== Nexora-AI API Server (inference + system metrics) ====================
  - job_name: 'nexora-inference'
    static_configs:
      - targets: ['localhost:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ==================== Qdrant Vector DB ====================
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # ==================== MinIO S3 ====================
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: '/minio/v2/metrics/cluster'
    scrape_interval: 30s

# ==================== Storage Configuration ====================
# Store data for 30 days with high resolution
# tsdb:
#   retention.time: 30d
#   retention.size: 50GB
