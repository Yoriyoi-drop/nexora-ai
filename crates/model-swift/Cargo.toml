[package]
name = "nexora-model-swift"
version = "0.1.0"
edition = "2021"
description = "NXR-SWIFT Model"

[dependencies]
nexora-model-core = { path = "../model-core" }
nexora-shared = { path = "../shared" }
nexora-transformer = { path = "../transformer" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
nexora-erp = { path = "../erp" }
nexora-atqs = { path = "../atqs" }
nexora-alignment = { path = "../alignment" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
futures.workspace = true

[features]
default = []
gpu = ["nexora-model-core/gpu", "nexora-shared/gpu", "nexora-has-moe-ffn/gpu", "nexora-erp/gpu", "nexora-atqs/gpu"]
cuda = ["nexora-model-core/cuda", "nexora-shared/cuda", "nexora-has-moe-ffn/cuda", "nexora-erp/cuda"]

