[package]
name = "nexora-alignment"
version = "0.2.0"
edition = "2021"
description = "Alignment frameworks for Nexora - SPARO (RLAIF, SPIN, DPO, IPO, KTO, RLVF)"

[dependencies]
nexora-shared = { path = "../shared" }
nexora-autograd = { path = "../autograd" }
nexora-oracle = { path = "../oracle", optional = true }
serde.workspace = true
anyhow.workspace = true
ndarray.workspace = true
rand.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
bincode = "1.3"
async-trait.workspace = true

[features]
oracle = ["nexora-oracle"]
gpu = ["nexora-autograd/gpu"]
