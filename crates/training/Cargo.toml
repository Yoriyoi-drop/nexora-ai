[package]
name = "nexora-training"
version = "0.1.0"
edition = "2021"
description = "Training pipeline for Nexora - gradient accumulation, LR scheduling, checkpointing"

[dependencies]
nexora-transformer = { path = "../transformer" }
nexora-autograd = { path = "../autograd" }
ndarray.workspace = true
serde.workspace = true
tracing.workspace = true
rand.workspace = true
anyhow.workspace = true
bytemuck = "1"

[features]
gpu = ["nexora-autograd/gpu", "nexora-transformer/gpu"]
