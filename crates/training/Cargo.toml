[package]
name = "nexora-training"
version = "0.2.0"
edition = "2021"
description = "Training pipeline for Nexora - gradient accumulation, LR scheduling, checkpointing"

[dependencies]
nexora-transformer = { path = "../transformer" }
nexora-autograd = { path = "../autograd" }
nexora-evaluation = { path = "../evaluation" }
ndarray.workspace = true
serde.workspace = true
tracing.workspace = true
rand.workspace = true
anyhow.workspace = true
bytemuck = "1"
nexora-monitoring = { path = "../monitoring" }
nexora-utils = { path = "../infrastructure/utils" }

[features]
default = ["gpu"]
gpu = ["nexora-autograd/gpu", "nexora-transformer/gpu"]
