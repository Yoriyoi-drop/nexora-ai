[package]
name = "nexora-model-core"
version = "0.1.0"
edition = "2021"
description = "Core model infrastructure — foundation model implementations and classifier utilities"

[dependencies]
nexora-shared = { path = "../shared" }
nexora-transformer = { path = "../transformer", default-features = false, features = ["gpu"] }
nexora-quantization = { path = "../quantization" }
nexora-core = { path = "../core", default-features = false, features = ["gpu"] }
nexora-hallucination = { path = "../hallucination" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ndarray.workspace = true
rand.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["rt"] }

[features]
default = ["gpu"]
gpu = ["nexora-transformer/gpu", "nexora-core/gpu", "nexora-shared/gpu"]
cuda = ["nexora-shared/cuda"]

