[package]
name = "nexora-inference"
version = "0.2.0"
edition = "2021"
description = "Inference engine for Nexora AI system"

[dependencies]
tokio = { workspace = true, features = ["sync", "macros", "rt", "net"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
crossbeam.workspace = true
chrono.workspace = true
rand.workspace = true
ndarray.workspace = true
num_cpus = "1.16"
ordered-float = "3.9"

# Internal dependencies
nexora-core = { path = "../core" }
nexora-intelligence = { path = "../intelligence" }
nexora-foundation = { path = "../foundation" }
nexora-transformer = { path = "../transformer" }
nexora-common = { path = "../infrastructure/common" }
nexora-blaa = { path = "../blaa" }
nexora-tokenizer = { path = "../tokenizer" }
nexora-runtime = { path = "../runtime" }

# For streaming
futures = "0.3"
tokio-stream = "0.1"

# For performance
rayon.workspace = true

# For distributed cluster
reqwest.workspace = true

# For system monitoring
sysinfo = "0.30"
procfs = "0.16"
nvml-wrapper = "0.9"
libc = "0.2"

# Compression
zstd = { workspace = true }

# GPU sampling
nexora-autograd = { path = "../autograd" }
nexora-memory = { path = "../memory" }

# Cross-layer dependencies (Phase 5 wiring)
nexora-quantization = { path = "../quantization" }
nexora-monitoring = { path = "../monitoring" }
nexora-isolation = { path = "../isolation" }
nexora-validation = { path = "../validation" }
nexora-utils = { path = "../infrastructure/utils" }
nexora-cognition = { path = "../cognition" }
nexora-database = { path = "../database" }

[features]
default = ["gpu"]
gpu = ["nexora-autograd/gpu", "nexora-transformer/gpu"]

[dev-dependencies]
mockall.workspace = true
tokio-test = "0.4"
criterion = "0.5"
tempfile = "3"

