[package]
name = "nexora-oracle"
version = "0.2.0"
edition = "2021"
description = "ORACLE - Optimized Retrieval-Augmented Code Learning Engine"

[dependencies]
nexora-core = { path = "../core" }
anyhow.workspace = true
ndarray.workspace = true
serde.workspace = true
rand.workspace = true
uuid.workspace = true
ndarray-rand = "0.15"
regex.workspace = true
once_cell = { workspace = true }
chrono.workspace = true
serde_json.workspace = true
nexora-autograd = { path = "../autograd" }
nexora-has-moe-ffn = { path = "../has-moe-ffn" }
tracing.workspace = true
syn = { version = "2.0", features = ["full", "visit", "parsing", "extra-traits"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
memmap2.workspace = true

[features]
default = []
gpu = ["nexora-autograd/gpu"]
