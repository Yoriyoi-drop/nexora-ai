[package]
name = "nexora-blaa"
version = "0.2.0"
edition = "2021"
authors = ["Nexora AI Contributors"]
license = "MIT OR Apache-2.0"
description = "BLAA (Black Language Model API) integration for Nexora AI"

[dependencies]
# Workspace dependencies
tokio = { workspace = true, features = ["net", "sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

# BLAA-specific dependencies
base64 = "0.22"
hmac = "0.13"
sha2.workspace = true
url = "2.4"
futures = { workspace = true }
bytes = "1"

[dev-dependencies]
tokio-test = "0.4"
mockall = { workspace = true }
