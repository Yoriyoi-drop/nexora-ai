[package]
name = "nexora-ai"
version = "0.2.0"
edition = "2021"
description = "Nexora AI - Multi-model cognitive architecture"

[dependencies]
nexora-core = { path = "../../crates/core" }
nexora-foundation = { path = "../../crates/foundation" }
nexora-tokenizer = { path = "../../crates/tokenizer" }
nexora-intelligence = { path = "../../crates/intelligence" }
nexora-memory = { path = "../../crates/memory" }
nexora-inference = { path = "../../crates/inference" }
nexora-blaa = { path = "../../crates/blaa" }
nexora-infrastructure = { path = "../../crates/infrastructure" }
nexora-datastream = { path = "../../crates/datastream", features = ["dataset", "toxicity", "prompt-injection"] }
nexora-deeplearning = { path = "../../crates/deeplearning" }
nexora-transformer = { path = "../../crates/transformer" }
nexora-monitoring = { path = "../../crates/monitoring" }
nexora-agent = { path = "../../crates/agent" }
nexora-alignment = { path = "../../crates/alignment" }
nexora-runtime = { path = "../../crates/runtime" }
nexora-models = { path = "../../crates/models" }
nexora-quantization = { path = "../../crates/quantization" }
nexora-isolation = { path = "../../crates/isolation" }
nexora-hallucination = { path = "../../crates/hallucination" }
nexora-benchmark = { path = "../../crates/benchmark" }
nexora-autograd = { path = "../../crates/autograd", default-features = false, features = ["std"] }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { workspace = true }
tower.workspace = true
futures.workspace = true
tower-http = { workspace = true, features = ["cors", "compression-br", "trace", "timeout"] }
hyper = "1.0"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile.workspace = true
rustls-pki-types = "1.0"
rcgen = "0.12"
clap = { version = "4.0", features = ["derive"] }
toml = "0.8"
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4", "serde"] }
async-trait = { workspace = true }
regex.workspace = true
tempfile.workspace = true
once_cell.workspace = true
rand.workspace = true
argon2.workspace = true
hmac = { version = "0.13", optional = true }
sha2 = { workspace = true }
hex = { workspace = true }
sysinfo = { workspace = true }
# psutil removed — sysinfo covers system stats
reqwest.workspace = true
arrow = { version = "53", default-features = false, features = ["ipc", "ipc_compression"] }
blas-src = { version = "0.14.0", optional = true }
openblas-src = { version = "0.10.16", optional = true }
mimalloc = { version = "0.1", optional = true }
jsonwebtoken = { version = "9" }
ndarray.workspace = true

[features]
default = ["gpu", "cuda", "server-auth", "server-billing", "server-dashboard", "server-gossip"]
production = ["mimalloc", "server-billing"]
blas = ["blas-src", "openblas-src"]
server-auth = []
server-billing = ["dep:hmac"]
server-dashboard = []
server-gossip = []
server-telemetry = []
tokenizer-train = []
gpu = [
    "nexora-deeplearning/gpu",
    "nexora-transformer/gpu",
    "nexora-inference/gpu",
]
cuda = ["gpu", "nexora-autograd/cuda"]
nccl = ["cuda", "nexora-transformer/nccl"]

[[bin]]
name = "nexora"
path = "src/main.rs"

[[bin]]
name = "generate-training-data"
path = "src/bin/generate_training_data.rs"

[[example]]
name = "basic_usage"
path = "examples/basic_usage.rs"

[[example]]
name = "chat_example"
path = "examples/chat_example.rs"

[[example]]
name = "server_example"
path = "examples/server_example.rs"
