[package]
name = "nexora-dashboard"
version = "0.3.0"
edition = "2021"
description = "Terminal UI dashboard for Nexora AI monitoring"

[dependencies]
ratatui = { workspace = true }
crossterm = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
nexora-monitoring = { path = "../../crates/monitoring" }
reqwest = { workspace = true, optional = true, features = ["json", "rustls-tls"] }

[features]
default = []
server-poll = ["dep:reqwest"]

[[bin]]
name = "dashboard"
path = "src/main.rs"
